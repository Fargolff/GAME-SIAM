mode: backtest
symbol: EURUSD
timeframe: H1
data_dir: data

initial_equity: 10000
risk_per_trade: 0.005
max_daily_loss_pct: 0.02
max_drawdown_pct: 0.10

# Cost assumptions must be realistic for your broker/account type.
spread_pips: 0.8
slippage_pips: 0.2
commission_per_lot_round_turn: 7.0

strategy:
  name: ema_trend
  params:
    fast: 20
    slow: 50
    atr_period: 14
    stop_atr: 2.0
    take_profit_atr: 3.0

# Phase 6 paper trading consumes the Phase 5 portfolio files.
# MT5 is used only for market data; no real order is sent.
paper:
  state_path: runtime/paper_state.json
  events_path: runtime/paper_events.csv
  weights_path: results/portfolio/portfolio_weights.csv
  candidates_path: results/portfolio/portfolio_candidates.csv
  poll_seconds: 30
  history_bars: 5000

live:
  enabled: false
  magic: 56001
  deviation_points: 20
